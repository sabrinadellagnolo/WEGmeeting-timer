<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer de Reunião</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #161b24;
      --border: #1f2733;
      --text: #e8ecf2;
      --muted: #5a6478;
      --accent: #00d4aa;
      --warn: #f59e0b;
      --danger: #ef4444;
      --ring: rgba(0,212,170,0.15);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
    }

    /* Ambient glow background */
    body::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(0,212,170,0.05) 0%, transparent 70%);
      pointer-events: none;
      transition: background 1s ease;
    }
    body.warning::before { background: radial-gradient(circle, rgba(245,158,11,0.08) 0%, transparent 70%); }
    body.danger::before  { background: radial-gradient(circle, rgba(239,68,68,0.1) 0%, transparent 70%); }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: rgba(13,15,20,0.8);
      backdrop-filter: blur(12px);
    }
    header span.dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      animation: pulse 2s infinite;
    }
    body.danger header span.dot { background: var(--danger); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 3.5rem;
      width: 100%;
      max-width: 540px;
      text-align: center;
      position: relative;
    }

    /* SVG ring */
    .ring-wrap {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto 2rem;
    }
    .ring-wrap svg {
      position: absolute;
      top: 0; left: 0;
      transform: rotate(-90deg);
    }
    .ring-bg { fill: none; stroke: var(--border); stroke-width: 6; }
    .ring-fg {
      fill: none;
      stroke: var(--accent);
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear, stroke 0.5s;
    }
    body.warning .ring-fg { stroke: var(--warn); }
    body.danger  .ring-fg { stroke: var(--danger); }

    .time-display {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 5rem;
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--text);
      transition: color 0.5s;
    }
    body.warning .time-display { color: var(--warn); }
    body.danger  .time-display { color: var(--danger); }

    .session-label {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    .session-name {
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 2rem;
      min-height: 1.5rem;
    }

    /* Controls */
    .presets {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
    }
    .preset-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 0.35rem 0.85rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .preset-btn:hover { border-color: var(--accent); color: var(--accent); }
    .preset-btn.active { border-color: var(--accent); color: var(--accent); background: var(--ring); }

    .custom-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }
    .custom-row input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.5rem 0.8rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      outline: none;
      transition: border 0.2s;
    }
    .custom-row input:focus { border-color: var(--accent); }
    .custom-row input::placeholder { color: var(--muted); }
    .set-btn {
      background: var(--border);
      border: none;
      color: var(--text);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .set-btn:hover { background: var(--accent); color: #000; }

    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 0.7rem 2rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.03em;
    }
    .btn-primary {
      background: var(--accent);
      color: #000;
      min-width: 130px;
    }
    .btn-primary:hover { filter: brightness(1.15); transform: translateY(-1px); }
    .btn-secondary {
      background: var(--border);
      color: var(--muted);
    }
    .btn-secondary:hover { color: var(--text); background: #2a3244; }

    /* Done overlay */
    .done-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(13,15,20,0.92);
      border-radius: 20px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
    }
    .done-overlay.show { display: flex; }
    .done-icon {
      font-size: 3rem;
      animation: bounce 0.6s ease;
    }
    .done-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      color: var(--danger);
      letter-spacing: 0.06em;
    }
    .done-sub { color: var(--muted); font-size: 0.85rem; }

    @keyframes bounce {
      0%   { transform: scale(0.5); opacity: 0; }
      70%  { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Shake on danger */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-6px); }
      40%,80% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.4s ease; }
  </style>
</head>
<body>
  <header>
    <span class="dot"></span>
    Timer de Reunião
  </header>

  <div class="card" id="card">
    <p class="session-label">Sessão atual</p>
    <p class="session-name" id="sessionName">—</p>

    <div class="ring-wrap">
      <svg viewBox="0 0 220 220" width="220" height="220">
        <circle class="ring-bg" cx="110" cy="110" r="98" />
        <circle class="ring-fg" id="ringFg" cx="110" cy="110" r="98"
          stroke-dasharray="615.75"
          stroke-dashoffset="0" />
      </svg>
      <div class="time-display" id="display">00:00</div>
    </div>

    <div class="presets">
      <button class="preset-btn" data-min="2" data-name="Check-in">2 min</button>
      <button class="preset-btn" data-min="5" data-name="Discussão">5 min</button>
      <button class="preset-btn" data-min="10" data-name="Apresentação">10 min</button>
      <button class="preset-btn" data-min="15" data-name="Sessão">15 min</button>
      <button class="preset-btn" data-min="30" data-name="Reunião">30 min</button>
    </div>

    <div class="custom-row">
      <input type="number" id="customMin" placeholder="Minutos" min="1" max="999" />
      <input type="text"   id="customLabel" placeholder="Nome da sessão (opcional)" />
      <button class="set-btn" onclick="applyCustom()">Definir</button>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">Iniciar</button>
      <button class="btn btn-secondary" onclick="resetTimer()">Reiniciar</button>
    </div>

    <div class="done-overlay" id="doneOverlay">
      <div class="done-icon">⏰</div>
      <div class="done-title">Tempo Esgotado!</div>
      <div class="done-sub" id="doneSub"></div>
      <button class="btn btn-primary" onclick="resetTimer()" style="margin-top:0.5rem">Novo Timer</button>
    </div>
  </div>

  <script>
    const CIRCUMFERENCE = 2 * Math.PI * 98; // ≈ 615.75

    let totalSeconds = 0;
    let remaining   = 0;
    let interval    = null;
    let running     = false;
    let sessionLabel = '';

    const display   = document.getElementById('display');
    const startBtn  = document.getElementById('startBtn');
    const ringFg    = document.getElementById('ringFg');
    const sessionEl = document.getElementById('sessionName');
    const overlay   = document.getElementById('doneOverlay');
    const doneSub   = document.getElementById('doneSub');
    const card      = document.getElementById('card');
    const body      = document.body;

    function fmt(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }

    function setTimer(minutes, label) {
      resetTimer();
      totalSeconds = minutes * 60;
      remaining    = totalSeconds;
      sessionLabel = label || `${minutes} min`;
      display.textContent = fmt(remaining);
      sessionEl.textContent = sessionLabel;
      updateRing();
      updateState();
    }

    function updateRing() {
      const pct = totalSeconds > 0 ? remaining / totalSeconds : 1;
      ringFg.style.strokeDashoffset = CIRCUMFERENCE * (1 - pct);
    }

    function updateState() {
      const pct = totalSeconds > 0 ? remaining / totalSeconds : 1;
      body.classList.remove('warning','danger');
      if (pct <= 0.1)      body.classList.add('danger');
      else if (pct <= 0.3) body.classList.add('warning');
    }

    function toggleTimer() {
      if (!totalSeconds) return;
      if (running) {
        clearInterval(interval);
        running = false;
        startBtn.textContent = 'Continuar';
      } else {
        running = true;
        startBtn.textContent = 'Pausar';
        interval = setInterval(tick, 1000);
      }
    }

    function tick() {
      if (remaining <= 0) {
        clearInterval(interval);
        running = false;
        finish();
        return;
      }
      remaining--;
      display.textContent = fmt(remaining);
      updateRing();
      updateState();

      // Shake card at 10s warning
      if (remaining === 10) {
        card.classList.add('shake');
        card.addEventListener('animationend', () => card.classList.remove('shake'), { once: true });
      }
    }

    function finish() {
      doneSub.textContent = sessionLabel ? `Sessão: ${sessionLabel}` : '';
      overlay.classList.add('show');
      // Browser notification (if permitted)
      if (Notification.permission === 'granted') {
        new Notification('⏰ Tempo esgotado!', { body: sessionLabel });
      }
    }

    function resetTimer() {
      clearInterval(interval);
      running = false;
      remaining = totalSeconds;
      display.textContent = totalSeconds ? fmt(remaining) : '00:00';
      startBtn.textContent = 'Iniciar';
      overlay.classList.remove('show');
      body.classList.remove('warning','danger');
      updateRing();
    }

    function applyCustom() {
      const min = parseInt(document.getElementById('customMin').value);
      const lbl = document.getElementById('customLabel').value.trim();
      if (!min || min < 1) return;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      setTimer(min, lbl || `${min} min`);
    }

    // Preset buttons
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        setTimer(parseInt(btn.dataset.min), btn.dataset.name);
      });
    });

    // Enter key on custom inputs
    ['customMin','customLabel'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') applyCustom();
      });
    });

    // Request notification permission silently
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  </script>
</body>
</html>
